# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-10-16"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: multiplayer_game_state
    status: active
    owner_system: keeper-browser
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    interface: "Players send kind:request envelopes to:'keeper'; the keeper browser resolves and sends filtered state/event envelopes"
    write_access: keeper-browser-only   # player browsers and the relay never write authoritative state
    referenced_by:
      - docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16
    revised: ""

  - state: investigator_identity
    status: active
    owner_system: investigator-records
    adr: docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    interface: "roster[].invId (immutable random string, created with the record); all visibility references use invId"
    write_access: created-once   # generated in createInvestigatorRecord; ensureInvIds fills gaps at every roster entry (v9 idempotent normalisation), never changed
    referenced_by:
      - docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    added: 2026-10-16
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: multiplayer_message_envelope
    status: active
    # revised 2026-10-16 (review F1/F3/F7): was pattern: rpc; signature had seq, no epoch/dseq, client-set from
    pattern: event_bus
    producer: keeper-browser
    consumers:
      - relay-server     # reads only room/to for delivery, never body; overwrites from
      - player-browser
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    signal_signature: "{ v, room, epoch, from (overwritten by relay from the connection identity), to: 'all'|'keeper'|[memberId], kind: 'state'|'event'|'request'|'system', dseq (per-recipient, assigned by relay), body } over wss:// (players) / ws://localhost (keeper); to:'all' only with kind:'system' (relay rejects any other combination)"
    # revised 2026-10-16 (review R-F6): was "to:'all' for kind:'system' or non-narrative structured state"
    referenced_by:
      - docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16
    revised: "2026-10-16"

  - contract: guest_projection
    status: active
    pattern: direct_call
    producer: keeper-browser
    consumers:
      - multiplayer-sync       # ADR-0002 builds snapshots and patches only from this
    adr: docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    # revised 2026-10-16 (review R-F1/R-F3/R-F7): was top-level allowlist only, developers bypassed personal limits, events unfiltered
    signal_signature: "projectFor(viewer { memberId, role: keeper|developer|guest, invIds, limits }, gameState) -> new view; guests: default-deny at top-level field, record type and record field; developers: game-data allowlist (never NEVER_PROJECT, e.g. aiSettings.apiKey) + personal limits; placeholders generated at projection; events carry no content and only reference view entries (rollId, msgId); projectHistoryPage shares layers 2-3"
    # revised 2026-10-16 (review R3-F1/R3-F2/R3-F3): was "developers: full state + personal limits"
    referenced_by:
      - docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
      - docs/architecture/adr-0002-multiplayer-sync-protocol.md
    added: 2026-10-16
    revised: "2026-10-16"

  - contract: player_request_and_result
    status: active
    pattern: event_bus
    producer: player-browser
    consumers:
      - keeper-browser
    adr: docs/architecture/adr-0002-multiplayer-sync-protocol.md
    # revised 2026-10-16 (review R3-F9/R3-F10): added seat check, roll invId, later types and the history_page channel
    signal_signature: "request { type: say|roll(invId)|share_clue|share_map|vote|history_page(beforeMsgId)|resync, reqId }; keeper checks the seat map before resolving -> event { type: 'request_result', reqId, ok, reason-code }; history_page replies on kind:'state' type:'history_page' without changing viewVer; later types: edit_own_card (22), set_limits (26), pause_request (27)"
    referenced_by:
      - docs/architecture/adr-0002-multiplayer-sync-protocol.md
    added: 2026-10-16
    revised: "2026-10-16"

# Example:
