# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets: []

# Example:
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
#     adr: docs/architecture/adr-0000-performance-targets.md
#     added: 2026-03-26
#     revised: ""
#
#   - system: combat
#     status: active
#     budget_ms: 2.0
#     adr: docs/architecture/adr-0003-combat-system.md
#     notes: "Includes physics queries, hitbox evaluation, and damage calculation"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: multiplayer_transport
    status: active
    api: WebSocket over TLS (wss://) to a Node.js relay in server/
    not: WebRTC peer-to-peer, hosted realtime services, Bluetooth
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    reason: "Same code offline (hotspot/Wi-Fi) and online (Tailscale); browsers cannot host Bluetooth"
    referenced_by:
      - docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16
    revised: ""

  - purpose: keeper_page_origin
    status: active
    api: "Keeper browser always opens http://localhost:8080 (served by the relay); players use the LAN / Tailscale https address"
    not: "Keeper opening the LAN IP or Tailscale address"
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    reason: "IndexedDB saves, AI key and module list are origin-scoped; http://localhost:8080 is the existing npm run serve origin (review F2)"
    referenced_by:
      - docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
      - docs/architecture/architecture-review-2026-10-16.md
    added: 2026-10-16
    revised: ""

  - purpose: player_connection_tiers
    status: active
    api: "Relay serves players over mkcert https, self-signed https and plain http at once; any tier may join"
    not: "Rejecting a player because the certificate is untrusted or the page is not https"
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    reason: "Certificates exist to make play possible, not to restrict it (author decision 2026-10-16). Players do not call AI or need offline cache."
    referenced_by:
      - docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16
    revised: ""

  - purpose: multiplayer_state_delivery
    status: active
    api: "Per-member projected view: snapshot first, then JSON-Patch-style diffs between consecutive projected views (baseVer/viewVer); arrays diffed by stable ids (msgId, rollId, id), never by index; chat window of 200 lives inside the projection"
    not: "Full snapshot every change; replaying raw state operations on player browsers; CRDT libraries"
    adr: docs/architecture/adr-0002-multiplayer-sync-protocol.md
    reason: "Diffs of filtered views cannot carry data the projection removed; bandwidth scales with change size"
    referenced_by:
      - docs/architecture/adr-0002-multiplayer-sync-protocol.md
    added: 2026-10-16
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: client_side_only_hiding
    status: active
    description: "Hidden data (dark-roll values, other players' private clues, content a player has limited)
      must never be sent to a guest device and hidden by its front end. Filter in the keeper browser before sending."
    why: "Anything delivered to a device can be read from its developer tools or network log."
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16

  - pattern: relay_game_logic
    status: active
    description: "The relay server must never run the rules engine, call AI, or read envelope bodies."
    why: "Keeps one authority (the keeper browser) and keeps the relay small and swappable."
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16

# Example:
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
#     status: active
#     description: "Systems must not directly reference Autoload singletons by name.
#       Use dependency injection or signals instead."
#     why: "Tight coupling to Autoloads makes systems untestable in isolation and
#       creates hidden dependencies that break when Autoload load order changes."
#     adr: docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#
#   - pattern: direct_cross_system_state_write
#     status: active
#     description: "A system must never write to state owned by another system.
#       Use signals or method calls on the owner instead."
#     why: "Direct state writes create race conditions and break the state
#       ownership model. The owning system must be the sole writer."
#     adr: docs/architecture/adr-0000-architecture-principles.md
#     added: 2026-03-26

  - pattern: trust_client_from_field
    status: active
    description: "The relay must never trust the envelope's client-supplied from field. It overwrites from with
      the identity the WebSocket connection joined with and validates kind/to against that role."
    why: "Otherwise a guest can forge from:'keeper' and broadcast fake state (review F1)."
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16

  - pattern: self_signed_lan_certificate
    # superseded 2026-10-16: author chose compatibility over strictness; self-signed https and plain http are allowed tiers
    status: "superseded_by: ADR-0001 (revision 2026-10-16, three connection tiers)"
    description: "Do not serve the LAN address with a self-signed certificate. Use mkcert with the root trusted on each
      device, or fall back to Tailscale."
    why: "Browsers do not register a Service Worker on a page with a certificate error (review F8)."
    adr: docs/architecture/adr-0001-multiplayer-relay-keeper-authority.md
    added: 2026-10-16

  - pattern: guest_view_blacklist
    status: active
    description: "Never build a guest view by copying gameState and deleting secret fields. Build it from the
      GUEST_TOP_LEVEL_ALLOWLIST so a new field is hidden until someone deliberately allows it."
    why: "New state fields are added often; a blacklist fails by leaking."
    adr: docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    added: 2026-10-16

  - pattern: name_based_visibility
    status: active
    description: "Visibility, seats and sharing must reference investigators by invId, never by name."
    why: "Names change, collide and are mistyped by the AI keeper."
    adr: docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    added: 2026-10-16

  - pattern: player_side_dice
    status: active
    description: "Player browsers must never roll dice or generate random results; a roll is a request the keeper browser resolves."
    why: "Rules fidelity (pillar 1) and a single authority."
    adr: docs/architecture/adr-0002-multiplayer-sync-protocol.md
    added: 2026-10-16

  - pattern: content_in_events
    status: active
    description: "Events (dice animations, toasts, request_result) must not carry game content. They reference an entry
      in the recipient's projected view (rollId, msgId); request_result reasons are predefined codes."
    why: "Keeps projectFor the only filter; a dark-roll animation carrying the value would bypass it (review R-F3)."
    adr: docs/architecture/adr-0002-multiplayer-sync-protocol.md
    added: 2026-10-16

  - pattern: record_default_visible_to_guests
    status: active
    description: "Inside allowlisted collections, records and fields are not visible to guests by default. system/tool/
      isHidden/isLocalOnly messages never reach guests, and only allowlisted record fields are copied."
    why: "chatHistory holds the keeper system prompt and tool results with dice values (review R-F1)."
    adr: docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    added: 2026-10-16

  - pattern: project_local_settings_or_secrets
    status: active
    description: "NEVER_PROJECT fields (aiSettings incl. the keeper's apiKey, and all local UI state) must not appear in any
      projected view, including the developer view. Developer views are built from an allowlist, never by copying runtime gameState."
    why: "The developer view would otherwise ship the AI key, in clear text on the plain-http tier (review R3-F1)."
    adr: docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    added: 2026-10-16

  - pattern: stored_placeholders
    status: active
    description: "Dark-roll placeholders are generated by projectFor; they must never be stored as records in the authoritative state."
    why: "Stored placeholders duplicate ids, reach the AI context and saves, and miss the guest chat window (review R3-F2)."
    adr: docs/architecture/adr-0003-per-player-visibility-and-save-v9.md
    added: 2026-10-16
